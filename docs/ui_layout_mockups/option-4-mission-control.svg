<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850">
  <defs>
    <style>
      .bg{fill:#f5f7fa}.panel{fill:#fff;stroke:#cbd5e1}.title{font:700 24px Segoe UI,Arial,sans-serif;fill:#111827}.h{font:700 16px Segoe UI,Arial,sans-serif;fill:#111827}.t{font:12px Segoe UI,Arial,sans-serif;fill:#1f2937}.small{font:11px Segoe UI,Arial,sans-serif;fill:#475569}.ok{fill:#e7f8ee;stroke:#16a34a}.warn{fill:#fff7ed;stroke:#f97316}.bad{fill:#ffe8e8;stroke:#dc2626}.info{fill:#eff6ff;stroke:#2563eb}.node{fill:#dcfce7;stroke:#16a34a}.infra{fill:#e5e7eb;stroke:#64748b}.bus{stroke:#475569;stroke-width:4}.dash{stroke:#2563eb;stroke-width:2;stroke-dasharray:5 4}.pill{rx:6;ry:6}
    </style>
  </defs>
  <rect class="bg" width="1400" height="850"/>
  <rect class="panel" x="20" y="20" width="1360" height="58" rx="6"/>
  <text class="title" x="42" y="57">Option 4: Mission Control Summary First</text>
  <text class="small" x="840" y="52">Best for pit diagnosis. Bringup uses the same summary blocks with scoped meaning.</text>

  <rect class="ok pill" x="20" y="98" width="250" height="115"/><text class="h" x="42" y="130">Runtime</text><text class="t" x="42" y="158">Bringup: scoped</text><text class="t" x="42" y="182">Diagnose: all robot</text>
  <rect class="warn pill" x="290" y="98" width="250" height="115"/><text class="h" x="312" y="130">CAN Health</text><text class="t" x="312" y="158">Bus load / errors</text><text class="t" x="312" y="182">Likely break clue</text>
  <rect class="info pill" x="560" y="98" width="250" height="115"/><text class="h" x="582" y="130">Scope</text><text class="t" x="582" y="158">active-group or all</text><text class="t" x="582" y="182">instantiated vs present</text>
  <rect class="bad pill" x="830" y="98" width="250" height="115"/><text class="h" x="852" y="130">Problems</text><text class="t" x="852" y="158">missing / degraded</text><text class="t" x="852" y="182">conflicting evidence</text>
  <rect class="panel" x="1100" y="98" width="280" height="115" rx="6"/><text class="h" x="1122" y="130">Next Check</text><text class="t" x="1122" y="158">Inspect CAN between</text><text class="t" x="1122" y="182">FALCON 9 and SPARKMAX 25</text>

  <rect class="panel" x="20" y="235" width="720" height="480" rx="6"/>
  <text class="h" x="42" y="265">Topology Context</text>
  <line class="bus" x1="70" y1="450" x2="690" y2="450"/>
  <rect class="infra" x="105" y="338" width="145" height="65" rx="8"/><text class="t" x="154" y="374">roboRIO</text>
  <rect class="node" x="500" y="310" width="170" height="70" rx="16"/><text class="t" x="548" y="350">FALCON 9</text>
  <rect class="bad" x="410" y="545" width="185" height="72" rx="16"/><text class="t" x="456" y="586">SPARKMAX 25</text>
  <line class="dash" x1="178" y1="403" x2="178" y2="450"/>
  <line class="dash" x1="585" y1="380" x2="585" y2="450"/>
  <line class="dash" x1="502" y1="450" x2="502" y2="545"/>
  <rect fill="none" stroke="#dc2626" stroke-width="3" x="475" y="430" width="125" height="150"/>
  <text class="h" fill="#dc2626" x="485" y="425">suspect region</text>

  <rect class="panel" x="760" y="235" width="380" height="480" rx="6"/>
  <text class="h" x="784" y="265">Selected Evidence</text>
  <text class="t" x="784" y="300">Device: SPARKMAX/NEO 25</text>
  <text class="t" x="784" y="328">Passive: seen then stale</text>
  <text class="t" x="784" y="356">Console: Spark timeout</text>
  <text class="t" x="784" y="384">Probe: present score 62/100</text>
  <text class="t" x="784" y="412">Manual: no rotation detected</text>
  <text class="t" x="784" y="440">Verdict: degraded / inspect CAN</text>
  <rect class="warn pill" x="784" y="475" width="300" height="105"/>
  <text class="t" x="804" y="505">Bringup mode reduces this to</text>
  <text class="t" x="804" y="529">basic selected-device status</text>
  <text class="t" x="804" y="553">and scoped motion checks.</text>

  <rect class="panel" x="1160" y="235" width="220" height="480" rx="6"/>
  <text class="h" x="1182" y="265">Action Stack</text>
  <rect class="info pill" x="1182" y="295" width="165" height="34"/><text class="t" x="1224" y="317">Probe</text>
  <rect class="info pill" x="1182" y="345" width="165" height="34"/><text class="t" x="1212" y="367">Run DSL</text>
  <rect class="info pill" x="1182" y="395" width="165" height="34"/><text class="t" x="1196" y="417">CAN Report</text>
  <rect class="warn pill" x="1182" y="455" width="165" height="34"/><text class="t" x="1200" y="477">Manual Run</text>
  <text class="small" x="1182" y="535">Bringup action list is</text>
  <text class="small" x="1182" y="557">shorter and scoped.</text>

  <rect class="panel" x="20" y="735" width="1360" height="85" rx="6"/>
  <text class="h" x="42" y="765">Problem Queue / Recent Events</text>
  <text class="t" x="42" y="792">Missing: 0 | Degraded: SPARKMAX/NEO 25 | Console: Spark timeout | Bus: recovered from error spike</text>
</svg>

