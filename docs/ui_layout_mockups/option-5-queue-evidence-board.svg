<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850">
  <defs>
    <style>
      .bg{fill:#f6f8fb}.panel{fill:#fff;stroke:#cbd5e1}.title{font:700 24px Segoe UI,Arial,sans-serif;fill:#111827}.h{font:700 16px Segoe UI,Arial,sans-serif;fill:#111827}.t{font:12px Segoe UI,Arial,sans-serif;fill:#1f2937}.small{font:11px Segoe UI,Arial,sans-serif;fill:#475569}.row{fill:#f8fafc;stroke:#d1d5db}.rowOn{fill:#e7f8ee;stroke:#16a34a}.rowBad{fill:#ffe8e8;stroke:#dc2626}.info{fill:#eff6ff;stroke:#2563eb}.warn{fill:#fff7ed;stroke:#f97316}.node{fill:#dcfce7;stroke:#16a34a}.infra{fill:#e5e7eb;stroke:#64748b}.bus{stroke:#475569;stroke-width:4}.dash{stroke:#2563eb;stroke-width:2;stroke-dasharray:5 4}.pill{rx:6;ry:6}
    </style>
  </defs>
  <rect class="bg" width="1400" height="850"/>
  <rect class="panel" x="20" y="20" width="1360" height="58" rx="6"/>
  <text class="title" x="42" y="57">Option 5: Queue And Evidence Board</text>
  <text class="small" x="800" y="52">Best for systematic device-by-device work. Topology becomes context.</text>

  <rect class="panel" x="20" y="100" width="300" height="700" rx="6"/>
  <text class="h" x="42" y="132">Bringup Queue / Suspect Queue</text>
  <rect class="rowOn" x="42" y="160" width="255" height="55" rx="6"/><text class="t" x="60" y="184">1 SPARKMAX/NEO 25</text><text class="small" x="60" y="205">current primary | in active-group</text>
  <rect class="row" x="42" y="225" width="255" height="55" rx="6"/><text class="t" x="60" y="249">2 FALCON 9</text><text class="small" x="60" y="270">eligible | not in group</text>
  <rect class="row" x="42" y="290" width="255" height="55" rx="6"/><text class="t" x="60" y="314">3 lmtSw0</text><text class="small" x="60" y="335">optional after motor bringup</text>
  <line x1="42" y1="375" x2="297" y2="375" stroke="#cbd5e1"/>
  <text class="h" x="42" y="410">Diagnose Queue</text>
  <rect class="rowBad" x="42" y="430" width="255" height="55" rx="6"/><text class="t" x="60" y="454">CAN break suspect</text><text class="small" x="60" y="475">between FALCON and SPARK</text>
  <rect class="rowBad" x="42" y="495" width="255" height="55" rx="6"/><text class="t" x="60" y="519">SPARKMAX/NEO 25</text><text class="small" x="60" y="540">console timeout</text>
  <rect class="row" x="42" y="560" width="255" height="55" rx="6"/><text class="t" x="60" y="584">PDP</text><text class="small" x="60" y="605">weak evidence</text>

  <rect class="panel" x="340" y="100" width="520" height="525" rx="6"/>
  <text class="h" x="364" y="132">Current Item Board</text>
  <text class="t" x="364" y="168">Selected: SPARKMAX/NEO 25</text>
  <text class="t" x="364" y="196">Mode: Bringup basic motor check</text>
  <rect class="info pill" x="364" y="225" width="200" height="42"/><text class="t" x="410" y="252">Right-Click Run</text>
  <rect class="info pill" x="580" y="225" width="200" height="42"/><text class="t" x="620" y="252">Record Result</text>
  <rect class="rowOn" x="364" y="300" width="450" height="130" rx="6"/>
  <text class="h" x="386" y="330">Live Values</text>
  <text class="t" x="386" y="360">cmdDuty 0.22 | appliedDuty 0.22 | current 0.18 A</text>
  <text class="t" x="386" y="388">velRpm 1480 | positionDelta 18.4 rot</text>
  <text class="t" x="386" y="416">verdict: rotating</text>
  <rect class="warn pill" x="364" y="460" width="450" height="90"/>
  <text class="h" x="386" y="490">Diagnose Variant</text>
  <text class="t" x="386" y="518">This same board switches to evidence stack and DSL test results.</text>

  <rect class="panel" x="880" y="100" width="500" height="525" rx="6"/>
  <text class="h" x="904" y="132">Topology Context</text>
  <line class="bus" x1="930" y1="320" x2="1335" y2="320"/>
  <rect class="infra" x="950" y="220" width="120" height="55" rx="8"/><text class="small" x="988" y="252">roboRIO</text>
  <rect class="node" x="1190" y="205" width="145" height="60" rx="14"/><text class="small" x="1230" y="240">FALCON 9</text>
  <rect class="node" x="1110" y="400" width="165" height="64" rx="14"/><text class="small" x="1148" y="437">SPARKMAX</text>
  <line class="dash" x1="1010" y1="275" x2="1010" y2="320"/>
  <line class="dash" x1="1262" y1="265" x2="1262" y2="320"/>
  <line class="dash" x1="1192" y1="320" x2="1192" y2="400"/>
  <rect fill="none" stroke="#f97316" stroke-width="3" x="1095" y="385" width="190" height="80"/>
  <text class="h" fill="#f97316" x="1105" y="378">current item</text>

  <rect class="panel" x="340" y="645" width="1040" height="155" rx="6"/>
  <text class="h" x="364" y="675">Evidence / Output Drawer</text>
  <text class="t" x="364" y="704">Bringup: recent manual result history, basic probe status, scoped warnings.</text>
  <text class="t" x="364" y="732">Diagnose: console evidence, passive visibility, active probe score, DSL output, raw decode.</text>
  <text class="small" x="364" y="765">Tradeoff: excellent for queues and systematic work, weaker as a spatial-first CAN-break screen unless topology context is strong.</text>
</svg>

